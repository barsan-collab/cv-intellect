<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CV Intellect</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }

    /* Ambient background */
    .bg-glow {
      position: fixed; top: -20%; left: 50%; transform: translateX(-50%);
      width: 700px; height: 600px; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, rgba(0,113,227,.1) 0%, transparent 65%);
      pointer-events: none;
    }
    .bg-glow-2 {
      position: fixed; bottom: -20%; right: -10%;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(191,90,242,.07) 0%, transparent 65%);
      pointer-events: none;
    }

    .auth-wrap {
      width: 100%; max-width: 400px; position: relative; z-index: 2;
      animation: scaleIn .4s var(--t-enter) both;
    }

    .auth-card {
      background: rgba(28,28,30,.75);
      -webkit-backdrop-filter: blur(50px) saturate(180%);
      backdrop-filter: blur(50px) saturate(180%);
      border: 1px solid var(--c-border);
      border-radius: var(--r-2xl);
      padding: 40px;
      box-shadow: var(--s-xl);
    }

    .auth-logo-wrap {
      display: flex; justify-content: center; margin-bottom: 28px;
    }
    .auth-logo {
      width: 60px; height: 60px; border-radius: 18px;
      background: var(--g-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 32px rgba(0,113,227,.35);
      animation: float 5s ease-in-out infinite;
    }
    .auth-title {
      font-size: 26px; font-weight: 800; color: var(--c-text);
      letter-spacing: -0.04em; text-align: center; margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px; color: var(--c-text4); text-align: center; margin-bottom: 30px;
    }

    .form-stack { display: flex; flex-direction: column; gap: 16px; }

    .btn-submit {
      width: 100%; padding: 14px; border-radius: 980px;
      background: var(--c-blue); color: #fff;
      font-family: var(--font); font-size: 15px; font-weight: 600;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background var(--t-base), transform var(--t-smooth), box-shadow var(--t-smooth);
      box-shadow: 0 4px 20px rgba(0,113,227,.3);
      letter-spacing: -0.01em; margin-top: 4px;
    }
    .btn-submit:hover { background: var(--c-blue-lt); transform: scale(1.01); box-shadow: 0 8px 32px rgba(0,113,227,.4); }
    .btn-submit:active { transform: scale(0.98); }

    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--c-text4); background: none; border: none; cursor: pointer;
      font-size: 14px; padding: 4px; transition: color var(--t-fast);
    }
    .toggle-pw:hover { color: var(--c-text3); }

    .auth-footer {
      margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--c-border);
      text-align: center; font-size: 14px; color: var(--c-text4);
    }
    .auth-footer a { color: var(--c-blue); font-weight: 600; text-decoration: none; margin-left: 4px; }
    .auth-footer a:hover { color: var(--c-blue-lt); }

    .back-link {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 24px; font-size: 14px; color: var(--c-text4);
      text-decoration: none; transition: color var(--t-fast);
    }
    .back-link:hover { color: var(--c-text3); }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text" id="loader-text">SIGNING IN</div>
  </div>

  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="auth-wrap">
    <a href="{{ url_for('index') }}" class="back-link">
      <i class="fa-solid fa-chevron-left" style="font-size:12px;"></i> Back to home
    </a>

    <div class="auth-card">
      <div class="auth-logo-wrap">
        <div class="auth-logo">🧠</div>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to your CV Intellect account</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}
            <div class="flash-msg"><i class="fa-solid fa-circle-exclamation"></i> {{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form id="login-form" action="{{ url_for('login') }}" method="POST" class="form-stack">
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" name="username" class="input-field" placeholder="Your username" required autocomplete="off">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" required>
            <button type="button" class="toggle-pw" id="toggle-pw">
              <i class="fa-solid fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create one free</a>
      </div>
    </div>
  </div>

  <script>
    const loader = document.getElementById('loader');
    window.addEventListener('load', () => setTimeout(() => loader.classList.add('hidden'), 250));
    document.getElementById('login-form').addEventListener('submit', () => {
      loader.classList.remove('hidden');
    });
    const pw = document.getElementById('password');
    const eye = document.getElementById('eye-icon');
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      eye.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });
  </script>
</body>
</html>
