<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CV Intellect</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }

    .bg-glow {
      position: fixed; top: -20%; right: -10%;
      width: 700px; height: 600px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,113,227,.1) 0%, transparent 65%);
      pointer-events: none;
    }
    .bg-glow-2 {
      position: fixed; bottom: -20%; left: -10%;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(191,90,242,.07) 0%, transparent 65%);
      pointer-events: none;
    }

    .auth-wrap {
      width: 100%; max-width: 420px; position: relative; z-index: 2;
      animation: scaleIn .4s var(--t-enter) both;
    }
    .auth-card {
      background: rgba(28,28,30,.75);
      -webkit-backdrop-filter: blur(50px) saturate(180%);
      backdrop-filter: blur(50px) saturate(180%);
      border: 1px solid var(--c-border);
      border-radius: var(--r-2xl); padding: 38px;
      box-shadow: var(--s-xl);
    }

    .auth-logo-wrap { display: flex; justify-content: center; margin-bottom: 24px; }
    .auth-logo {
      width: 58px; height: 58px; border-radius: 16px;
      background: var(--g-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; box-shadow: 0 8px 32px rgba(0,113,227,.35);
      animation: float 5s ease-in-out infinite;
    }
    .auth-title { font-size: 24px; font-weight: 800; color: var(--c-text); letter-spacing: -0.04em; text-align: center; margin-bottom: 5px; }
    .auth-sub   { font-size: 14px; color: var(--c-text4); text-align: center; margin-bottom: 26px; }

    .form-stack { display: flex; flex-direction: column; gap: 14px; }

    /* Role selector */
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .role-option { position: relative; }
    .role-option input { position: absolute; opacity: 0; pointer-events: none; }
    .role-label {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 14px; border-radius: var(--r-md);
      border: 1px solid var(--c-border); cursor: pointer;
      background: rgba(255,255,255,.04);
      transition: border-color var(--t-base), background var(--t-base), color var(--t-base);
      font-size: 14px; font-weight: 500; color: var(--c-text3);
    }
    .role-label i { font-size: 15px; }
    .role-option input:checked + .role-label {
      border-color: rgba(0,113,227,.4); background: rgba(0,113,227,.1); color: #5ac8fa;
    }
    .role-label:hover { border-color: var(--c-border-2); color: var(--c-text2); }

    /* Strength bar */
    .strength-bar-wrap { height: 3px; background: rgba(255,255,255,.06); border-radius: 100px; overflow: hidden; margin-top: 8px; }
    .strength-bar { height: 100%; border-radius: 100px; width: 0; transition: width .3s ease, background .3s ease; }
    .field-feedback { font-size: 11px; font-weight: 600; margin-top: 5px; font-family: var(--font-mono); }
    .field-feedback.ok  { color: var(--c-green); }
    .field-feedback.bad { color: var(--c-red); }
    .field-feedback.mid { color: var(--c-orange); }

    .btn-submit {
      width: 100%; padding: 14px; border-radius: 980px;
      font-family: var(--font); font-size: 15px; font-weight: 600;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background var(--t-base), transform var(--t-smooth), box-shadow var(--t-smooth), opacity var(--t-base);
      letter-spacing: -0.01em; margin-top: 4px;
    }
    .btn-submit.ready {
      background: var(--c-blue); color: #fff;
      box-shadow: 0 4px 20px rgba(0,113,227,.3);
    }
    .btn-submit.ready:hover { background: var(--c-blue-lt); transform: scale(1.01); box-shadow: 0 8px 32px rgba(0,113,227,.4); }
    .btn-submit.ready:active { transform: scale(0.98); }
    .btn-submit.disabled { background: rgba(255,255,255,.06); color: var(--c-text4); cursor: not-allowed; }

    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--c-text4); background: none; border: none; cursor: pointer;
      font-size: 14px; padding: 4px; transition: color var(--t-fast);
    }
    .toggle-pw:hover { color: var(--c-text3); }

    .auth-footer {
      margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--c-border);
      text-align: center; font-size: 14px; color: var(--c-text4);
    }
    .auth-footer a { color: var(--c-blue); font-weight: 600; text-decoration: none; margin-left: 4px; }
    .auth-footer a:hover { color: var(--c-blue-lt); }

    .back-link {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 22px; font-size: 14px; color: var(--c-text4);
      text-decoration: none; transition: color var(--t-fast);
    }
    .back-link:hover { color: var(--c-text3); }

    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
    .label-count { font-size: 11px; color: var(--c-text4); font-family: var(--font-mono); }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">CREATING ACCOUNT</div>
  </div>

  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="auth-wrap">
    <a href="{{ url_for('index') }}" class="back-link">
      <i class="fa-solid fa-chevron-left" style="font-size:12px;"></i> Back to home
    </a>

    <div class="auth-card">
      <div class="auth-logo-wrap">
        <div class="auth-logo">🧠</div>
      </div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-sub">Join CV Intellect — free forever</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}{% for msg in messages %}
          <div class="flash-msg"><i class="fa-solid fa-circle-exclamation"></i> {{ msg }}</div>
        {% endfor %}{% endif %}
      {% endwith %}

      <form id="reg-form" action="{{ url_for('register') }}" method="POST" class="form-stack">

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" style="margin:0;">Username</label>
            <span class="label-count" id="uname-count">min 4 chars</span>
          </div>
          <div class="input-wrap">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="uname" name="username" class="input-field" placeholder="e.g. john_doe" required autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Account Role</label>
          <div class="role-grid">
            <div class="role-option">
              <input type="radio" name="role" id="role-applicant" value="applicant" checked>
              <label class="role-label" for="role-applicant">
                <i class="fa-solid fa-user"></i> Applicant
              </label>
            </div>
            <div class="role-option">
              <input type="radio" name="role" id="role-hr" value="hr">
              <label class="role-label" for="role-hr">
                <i class="fa-solid fa-shield-halved"></i> HR Recruiter
              </label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="pw" name="password" class="input-field" placeholder="••••••••" required>
            <button type="button" class="toggle-pw" id="toggle-pw">
              <i class="fa-solid fa-eye" id="eye-icon"></i>
            </button>
          </div>
          <div class="strength-bar-wrap"><div class="strength-bar" id="str-bar"></div></div>
          <div class="field-feedback" id="str-text"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-circle-check input-icon"></i>
            <input type="password" id="pw-confirm" class="input-field" placeholder="••••••••" required>
          </div>
          <div class="field-feedback" id="match-text"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit disabled" disabled>
          <span id="btn-label">Fill required fields</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="{{ url_for('login') }}">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const loader   = document.getElementById('loader');
    const regForm  = document.getElementById('reg-form');
    const unameEl  = document.getElementById('uname');
    const uCount   = document.getElementById('uname-count');
    const pwEl     = document.getElementById('pw');
    const pwConf   = document.getElementById('pw-confirm');
    const strBar   = document.getElementById('str-bar');
    const strText  = document.getElementById('str-text');
    const matchTxt = document.getElementById('match-text');
    const submitBtn= document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');

    window.addEventListener('load', () => setTimeout(() => loader.classList.add('hidden'), 250));
    regForm.addEventListener('submit', () => loader.classList.remove('hidden'));

    document.getElementById('toggle-pw').addEventListener('click', () => {
      const show = pwEl.type === 'password';
      pwEl.type = show ? 'text' : 'password';
      document.getElementById('eye-icon').className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    let valid = { uname: false, pw: false, match: false };

    unameEl.addEventListener('input', () => {
      const v = unameEl.value.trim();
      valid.uname = v.length >= 4;
      uCount.textContent = valid.uname ? '✓' : `${v.length}/4`;
      uCount.style.color = valid.uname ? 'var(--c-green)' : '';
      checkAll();
    });

    pwEl.addEventListener('input', () => {
      const v = pwEl.value;
      let score = 0;
      if (v.length >= 6) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const lvls = [
        { w:'0%',   c:'transparent', t:'', cls:'' },
        { w:'33%',  c:'var(--c-red)',    t:'Weak',   cls:'bad' },
        { w:'66%',  c:'var(--c-orange)', t:'Medium', cls:'mid' },
        { w:'100%', c:'var(--c-green)',  t:'Strong', cls:'ok'  }
      ];
      const lvl = v.length === 0 ? lvls[0] : score <= 1 ? lvls[1] : score <= 2 ? lvls[2] : lvls[3];
      strBar.style.width = lvl.w; strBar.style.background = lvl.c;
      strText.textContent = lvl.t ? `Strength: ${lvl.t}` : '';
      strText.className = `field-feedback ${lvl.cls}`;
      valid.pw = score >= 2 && v.length >= 6;
      checkMatch();
    });

    function checkMatch() {
      const p1 = pwEl.value, p2 = pwConf.value;
      if (!p2) { matchTxt.textContent = ''; valid.match = false; }
      else if (p1 === p2) {
        matchTxt.textContent = '✓ Passwords match'; matchTxt.className = 'field-feedback ok';
        pwConf.classList.remove('error'); pwConf.classList.add('success'); valid.match = true;
      } else {
        matchTxt.textContent = '✗ Do not match'; matchTxt.className = 'field-feedback bad';
        pwConf.classList.remove('success'); pwConf.classList.add('error'); valid.match = false;
      }
      checkAll();
    }
    pwConf.addEventListener('input', checkMatch);

    function checkAll() {
      const ok = valid.uname && valid.pw && valid.match;
      submitBtn.disabled = !ok;
      submitBtn.className = `btn-submit ${ok ? 'ready' : 'disabled'}`;
      btnLabel.textContent = ok ? 'Create Account' : 'Fill required fields';
    }
  </script>
</body>
</html>
